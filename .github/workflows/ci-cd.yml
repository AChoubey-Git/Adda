name: Adda CI/CD

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Local Mongo for tests only — production uses Atlas
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      # Local Redis for tests only — production uses Upstash
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present
        env:
          MONGODB_URI: mongodb://localhost:27017/adda-test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ''
          JWT_SECRET: test-secret-ci
          JWT_REFRESH_SECRET: test-refresh-secret-ci

      - name: Build (verify TypeScript compiles)
        run: npm run build

  # ─── Frontend Tests ───────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build with placeholder URLs — real URLs are injected by Vercel at deploy time
      - name: Build (verify React compiles)
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:3001/api/v1
          REACT_APP_SOCKET_URL: http://localhost:3001/chat
          CI: false

  # ─── Deploy Backend → Railway ─────────────────────────────────────────────
  # Railway watches this repo and auto-builds from backend/Dockerfile.
  # This job just waits for tests to pass, then triggers Railway to deploy.
  # Railway must have "Wait for CI" enabled in project settings.
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [backend-test]              # only deploy if tests pass
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      # Triggers Railway to pick up the latest commit and start a new build.
      # Railway builds from the Dockerfile inside backend/ using your repo source.
      - name: Trigger Railway redeploy
        run: railway up --service backend --detach
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Deploy Frontend → Vercel ─────────────────────────────────────────────
  # Vercel builds the React app from frontend/ source on every main push.
  # REACT_APP_* env vars are set in the Vercel dashboard (baked in at build time).
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-test]             # only deploy if build passes
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project config (.vercel/project.json with orgId + projectId)
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      # Build — REACT_APP_* vars are set in Vercel dashboard, not here
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      # Push the pre-built output to Vercel's CDN
      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

  # ─── Electron Desktop Build ───────────────────────────────────────────────
  electron-build:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_SOCKET_URL: ${{ secrets.REACT_APP_SOCKET_URL }}
          CI: false

      - name: Package — Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage

      - name: Package — macOS DMG
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg

      - name: Package — Windows NSIS installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.dmg
            frontend/dist/*.exe
          retention-days: 7
          if-no-files-found: warn

  # ─── Publish GitHub Release with desktop installers ───────────────────────
  release-electron:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [electron-build]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download all electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: electron-dist
          pattern: 'electron-*'
          merge-multiple: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Adda Desktop v1.0.${{ github.run_number }}"
          body: |
            ## Adda Desktop — Build ${{ github.run_number }}

            **Commit:** `${{ github.sha }}`

            ### Download for your platform:
            | Platform | Installer |
            |----------|-----------|
            | 🪟 Windows | `.exe` |
            | 🍎 macOS | `.dmg` |
            | 🐧 Linux | `.AppImage` |

            > Desktop app connects to the production API automatically.
          draft: false
          prerelease: false
          files: |
            electron-dist/**/*.exe
            electron-dist/**/*.dmg
            electron-dist/**/*.AppImage
