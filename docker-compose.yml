version: '3.9'

# ─── Local Development Only ───────────────────────────────────────────────────
# This file starts just the services you need to run Adda locally.
# MongoDB runs on Atlas cloud — no local container needed.
# Usage:
#   docker compose up -d        (start Redis)
#   docker compose down         (stop Redis)

services:
  # ─── Redis (local dev cache / pub-sub) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adda-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    # No password for local dev — matches REDIS_PASSWORD= (empty) in .env
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

volumes: {}
