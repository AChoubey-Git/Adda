name: Adda CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  # Fixed: was github.repository_owner/chatapp (wrong); github.repository = owner/repo-name
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ─── Backend Tests ────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present
        env:
          MONGODB_URI: mongodb://localhost:27017/chatapp-test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Build
        run: npm run build

  # ─── Frontend Tests ───────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:3001/api/v1
          REACT_APP_SOCKET_URL: http://localhost:3001/chat
          CI: false

  # ─── Docker Build & Push (main branch only) ───────────────────────────────
  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image is not needed for Railway+Vercel deploy,
      # but kept so the image is available for self-hosted / Docker Compose users.
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            REACT_APP_SOCKET_URL=${{ secrets.REACT_APP_SOCKET_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy Backend → Railway ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      # Railway watches the GHCR :latest tag. This command triggers a redeploy
      # of the backend service so it pulls the new image just pushed above.
      - name: Redeploy backend service on Railway
        run: railway redeploy --service backend --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Deploy Frontend → Vercel ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_SOCKET_URL: ${{ secrets.REACT_APP_SOCKET_URL }}
          CI: false

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

  # ─── Electron Desktop Build ───────────────────────────────────────────────
  electron-build:
    name: Build Electron App
    runs-on: ${{ matrix.os }}
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_SOCKET_URL: ${{ secrets.REACT_APP_SOCKET_URL }}
          CI: false

      - name: Build Electron (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage

      - name: Build Electron (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            frontend/dist/*.AppImage
            frontend/dist/*.dmg
            frontend/dist/*.exe
          retention-days: 30

  # ─── Publish GitHub Release with Electron installers ──────────────────────
  release-electron:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [electron-build]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write  # needed to create releases and upload assets

    steps:
      - name: Download all electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: electron-dist
          pattern: 'electron-*'
          merge-multiple: false

      - name: List downloaded files (debug)
        run: find electron-dist -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Adda v1.0.${{ github.run_number }}"
          body: |
            ## Adda Desktop — Build ${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ### Download the right installer for your OS:
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `.exe` (NSIS installer) |
            | 🍎 macOS | `.dmg` (disk image) |
            | 🐧 Linux | `.AppImage` (portable) |

            > The desktop app connects to the production backend automatically.
          draft: false
          prerelease: false
          files: |
            electron-dist/**/*.exe
            electron-dist/**/*.dmg
            electron-dist/**/*.AppImage
