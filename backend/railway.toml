# Railway service configuration for Adda backend
# Docs: https://docs.railway.app/reference/config-as-code
#
# HOW RAILWAY BUILDS THIS:
#   1. Railway connects to your GitHub repo
#   2. It uses the Dockerfile in backend/ (this file is also in backend/)
#   3. Every push to main triggers a new build from source
#   4. Set root directory to "backend" in Railway dashboard service settings

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Health check — NestJS exposes this via the health module
healthcheckPath = "/api/v1/auth/health"
healthcheckTimeout = 30

# Allow 20 seconds for in-flight requests to finish before stopping
drainSeconds = 20
