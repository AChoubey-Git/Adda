version: '3.9'

services:
  # ─── MongoDB ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: adda-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: adda
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - adda-network

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adda-redis
    restart: unless-stopped
    command: redis-server --requirepass addaredis
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - adda-network

  # ─── Backend ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adda-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongo:27017/adda?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: addaredis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      - mongo
      - redis
    networks:
      - adda-network
    volumes:
      - uploads:/app/uploads

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:3001/api/v1
        REACT_APP_SOCKET_URL: http://localhost:3001/chat
    container_name: adda-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - adda-network

volumes:
  mongo_data:
  redis_data:
  uploads:

networks:
  adda-network:
    driver: bridge
