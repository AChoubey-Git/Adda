# Railway service configuration for Adda backend
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Use the Dockerfile in the backend/ directory.
# Railway will detect this automatically when the service root is set to /backend.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# How many replicas to run (Hobby plan: 1 max)
numReplicas = 1

# Restart policy on crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Health check — pings the NestJS health endpoint
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30

# Drain requests for 20s before stopping (zero-downtime deploys)
drainSeconds = 20
